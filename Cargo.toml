[workspace]
members = [".", "cli"]
resolver = "3"

[package]
name = "mafis"
version = "0.5.0"
edition = "2024"
authors = ["Teddy Truong"]
description = "Multi-Agent Fault Injection Simulator — a fault resilience observatory for lifelong MAPF"
license = "MIT"
repository = "https://github.com/stasis-industries/mafis"
homepage = "https://stasis-website.vercel.app"
keywords = ["mapf", "fault-injection", "simulation", "bevy", "wasm"]
categories = ["simulation", "science", "algorithms"]

[lib]
name = "mafis"
crate-type = ["rlib"]

[[bin]]
name = "mafis"
path = "src/main.rs"

[dependencies]
# Only what MAFIS renders: PBR meshes, MSAA, default tonemapping (its LUT needs zstd).
# The full 3d_bevy_render/default_platform sets add glTF, animation, text, gamepads,
# gizmos and post-processing: dead weight in the WASM download and systems run every frame.
bevy = { version = "0.18", default-features = false, features = [
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "std",
    "bevy_winit",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "bevy_core_pipeline",
    "bevy_pbr",
    "tonemapping_luts",
    "zstd_rust",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rand = "0.9"
rand_chacha = "0.9"
smallvec = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlElement",
    "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlCanvasElement",
    "console",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time = "1"
# Compile out info/debug/trace logs and spans in release WASM: bevy_log's tracing-wasm
# layer turns each span into performance.mark/measure entries that are never cleared.
tracing = { version = "0.1", default-features = false, features = ["release_max_level_warn"] }
log = { version = "0.4", default-features = false, features = ["release_max_level_warn"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_egui = "0.39"
egui_plot = "0.34"
egui = "0.33"
rfd = "0.17"
rayon = "1.10"
ron = "0.12"
directories = "6"

[dev-dependencies]
proptest = "1"

[features]
default = []
headless = []  # Desktop experiment-only: no 3D rendering, no observatory

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
incremental = false
debug = false
strip = true
panic = "abort"

# Desktop experiment runner: optimize for speed, not size
[profile.release-desktop]
inherits = "release"
lto = "thin"
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
